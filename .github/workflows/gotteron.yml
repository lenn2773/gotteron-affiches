
name: Affiches Gottéron

'on':
  push:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generation:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install Pillow

      - name: Générer l'affiche
        run: python main.py

      - name: Publier l'affiche
        uses: actions/upload-artifact@v4
        with:
          name: affiche-gotteron
          path: output/affiche.png
          if-no-files-found: error
          retention-days: 14
