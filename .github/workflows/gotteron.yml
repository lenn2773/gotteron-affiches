
name: Affiches Gottéron

'on':
  push:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generation:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install Pillow

      - name: Générer l'affiche
        run: python main.py

      - name: Enregistrer l'affiche dans le dépôt
        run: |
          cp output/affiche.png affiche.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add affiche.png
          if git diff --cached --quiet; then
            echo "L'affiche n'a pas changé."
          else
            git commit -m "Mise à jour affiche Gottéron [skip ci]"
            git push
          fi

      - name: Publier l'affiche en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: affiche-gotteron
          path: output/affiche.png
          if-no-files-found: error
          retention-days: 14
